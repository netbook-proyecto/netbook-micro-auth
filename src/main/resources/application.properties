spring.application.name=micro-auth

# ===================================================================
# MANEJO DE ERRORES WEB
# ===================================================================
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
server.error.include-message=always
# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/micro_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=microser_auth
spring.datasource.password=Auth.2026@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE (ORM)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# POOL DE CONEXIONES HIKARICP
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# CONFIGURACIÓN DEL TOKEN JWT
# ===================================================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Puerto de escucha oficial del microservicio de autenticación
server.port=5001

# ===================================================================
# CONFIGURACIÓN DE SWAGGER (Estandarizada para no romper el filtro)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

app.name=Auth
app.version=1.0.1