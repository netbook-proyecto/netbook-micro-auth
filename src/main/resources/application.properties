# ===================================================================
# CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=micro-auth
server.port=5001
eureka.client.enabled=false

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ===================================================================
# IMPORTANTE: Si estás ejecutando el proyecto desde IntelliJ (Windows), 
# usa 'localhost'. Si estás dentro de un contenedor Docker, usa 'host.docker.internal'.
spring.datasource.url=jdbc:mysql://localhost:3306/micro_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=microser_auth
spring.datasource.password=Auth.2026@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# HIKARICP (POOL DE CONEXIONES)
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# SEGURIDAD Y JWT
# ===================================================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# ===================================================================
# SWAGGER (DOCUMENTACIÓN)
# ===================================================================
springdoc.swagger-ui.path=/Auth.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

# ===================================================================
# ERRORES (DEBUGGING)
# ===================================================================
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
server.error.include-message=always